<!DOCTYPE html>
<html lang="da">
<head>

<meta charset="UTF-8">
<title>Alle Mod En</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f7fa;
    text-align:center;
    margin:0;
    padding:40px;
}

#welcome{
    margin-top:150px;
}

#welcomeTitle{
    font-size:120px;
    color:#005a9c;
    font-weight:900;
}

#welcomeSub{
    font-size:42px;
    color:#666;
}

#question{
    font-size:48px;
    font-weight:bold;
    margin-bottom:30px;
}

#timer{
    font-size:80px;
    color:#d83b01;
}

#count{
    font-size:60px;
    color:#005a9c;
    font-weight:bold;
}

#results{
    margin-top:30px;
}

.bar{
    background:#005a9c;
    height:30px;
}

.row{
    display:flex;
    align-items:center;
    gap:10px;
    margin:8px auto;
    max-width:800px;
}

.label{
    width:120px;
    text-align:right;
    font-weight:bold;
}

#scoreBarContainer{

    width:900px;

    margin:40px auto;
}

#scoreScale{

    display:flex;

    justify-content:space-between;

    font-weight:bold;

    font-size:20px;

    margin-bottom:10px;
}

#scoreBar{

    position:relative;

    height:10px;

    background:#cccccc;

    border-radius:10px;
}

.marker{

    position:absolute;

    top:-8px;

    width:24px;

    height:24px;

    border-radius:50%;

    transform:translateX(-50%);
}

.rangeLine{

    position:absolute;

    top:0;

    height:10px;

    background:#d83b01;

    border-radius:10px;
}

#scoreLegend{

    margin-top:30px;

    font-size:22px;

    line-height:1.8;
}

#winnerText{

    font-size:100px;

    font-weight:900;

    color:#005a9c;

    margin-top:30px;

    text-transform:uppercase;
}

</style>

</head>

<body>

<div id="welcome">

<h1 id="welcomeTitle">
ALLE MOD EN
</h1>

<h2 id="welcomeSub">
Spildevand Plan & Projekt
</h2>

</div>

<div id="game" style="display:none;">

<h1 id="question">
Indlæser spørgsmål...
</h1>

<div id="timer">
30
</div>

<h2>
Svar modtaget
</h2>

<div id="count">
0
</div>

<div id="results">
</div>

<div id="scoreBarContainer"
     style="display:none;">

    <div id="scoreScale">

        <span id="rangeMinLabel">
            0
        </span>

        <span id="rangeMaxLabel">
            200
        </span>

    </div>

    <div id="scoreBar">
    </div>

    <div id="scoreLegend">
    </div>

</div>

<div id="histogram"
     style="display:none;">
</div>


</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
 getFirestore,
 collection,
 onSnapshot,
 doc
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {

 apiKey: "GFD3K4mE3uLxfVnTOKfz9KU8HuPMVrY",

 authDomain:
 "alle-mod-en.firebaseapp.com",

 projectId:
 "alle-mod-en",

 storageBucket:
 "alle-mod-en.firebasestorage.app",

 messagingSenderId:
 "982698004873",

 appId:
 "1:982698004873:web:6d0494926004041fae1158"

};

const app =
 initializeApp(firebaseConfig);

const db =
 getFirestore(app);

let currentRound = 0;
let roundStartedAt = 0;
let roundLength = 30;

let playerGuess = 0;
let actualResult = 0;

let showAverage = false;
let showActual = false;

let averageGuess = 0;
let minGuess = 0;
let maxGuess = 0;

let rangeMin = 0;
let rangeMax = 200;

onSnapshot(
 doc(db,"Games","current"),
 snapshot => {

   const data =
     snapshot.data();

    rangeMin =
    data.rangeMin ?? 0;

    rangeMax =
    data.rangeMax ?? 200;

    document
    .getElementById("rangeMinLabel")
    .innerText =
    rangeMin;

    document
    .getElementById("rangeMaxLabel")
    .innerText =
    rangeMax;

   currentRound =
     data.round || 0;

   roundStartedAt =
     data.roundStartedAt || 0;

   roundLength =
     data.roundLength || 30;

   playerGuess =
     data.playerGuess || 0;

   actualResult =
     data.actualResult || 0;

   showAverage =
     data.showAverage || false;

   showActual =
     data.showActual || false;

   if(currentRound === 0){

      document
       .getElementById("welcome")
       .style.display = "block";

      document
       .getElementById("game")
       .style.display = "none";

   }
   else{

      document
       .getElementById("welcome")
       .style.display = "none";

      document
       .getElementById("game")
       .style.display = "block";

      document
       .getElementById("question")
       .innerText =
       data.title;

   }

 });

onSnapshot(
 collection(db,"guesses"),
 snapshot => {

   let values = [];

   snapshot.forEach(docItem => {

      const data =
       docItem.data();

      if(data.round === currentRound){

         values.push(
           Number(data.value)
         );

      }
      console.log(values);
   });

   document
    .getElementById("count")
    .innerText =
    values.length;

   if(values.length > 0){

      averageGuess =
       values.reduce(
         (a,b)=>a+b,
         0
       ) / values.length;

      minGuess =
       Math.min(...values);

      maxGuess =
       Math.max(...values);

   }

   drawHistogram(values);

 });

function drawHistogram(values){

 const histogram =
 document.getElementById("histogram");

 histogram.innerHTML = "";

 if(values.length === 0){
    return;
 }

 const bucketSize = 10;
 const buckets = {};

 values.forEach(v => {

   const bucket =
     Math.floor(v / bucketSize)
      * bucketSize;

   buckets[bucket] =
     (buckets[bucket] || 0) + 1;

 });

 Object.keys(buckets)
 .sort((a,b)=>a-b)
 .forEach(bucket => {

   const count =
     buckets[bucket];

   histogram.innerHTML += `
   <div class="row">

      <div class="label">
      ${bucket}-${Number(bucket)+9}
      </div>

      <div class="bar"
           style="width:${count*25}px">
      </div>

      <div>
      ${count}
      </div>

   </div>
   `;
 });

}

function drawScoreBar(){

    const scoreBar =
      document.getElementById("scoreBar");

    const scoreLegend =
      document.getElementById("scoreLegend");

    scoreBar.innerHTML = "";

    scoreLegend.innerHTML = "";

    const size =
      rangeMax - rangeMin;

    const minPos =
      ((minGuess-rangeMin)/size)*100;

    const maxPos =
      ((maxGuess-rangeMin)/size)*100;

    const playerPos =
      ((playerGuess-rangeMin)/size)*100;

    scoreBar.innerHTML += `

        <div
            class="rangeLine"
            style="
            left:${minPos}%;
            width:${maxPos-minPos}%;
            ">
        </div>

    `;

    scoreBar.innerHTML += `

    <div
        style="
        position:absolute;
        left:${minPos}%;
        top:-35px;
        transform:translateX(-50%);
        color:#d83b01;
        font-weight:bold;
        ">
        ${minGuess}
    </div>

    <div
        style="
        position:absolute;
        left:${maxPos}%;
        top:-35px;
        transform:translateX(-50%);
        color:#d83b01;
        font-weight:bold;
        ">
        ${maxGuess}
    </div>

    `;

    scoreLegend.innerHTML +=
      `🟠 Deltager (${playerGuess})<br>`;

    if(showAverage){

        const avgPos =
          ((averageGuess-rangeMin)/size)
          *100;

        scoreBar.innerHTML += `

            <div class="marker"
                 style="
                    left:${avgPos}%;
                    background:blue;
                 ">
            </div>

        `;

        scoreLegend.innerHTML +=
          `🔵 Publikum (${averageGuess.toFixed(1)})<br>`;
    }

    if(showActual){

        const actualPos =
          ((actualResult-rangeMin)/size)
          *100;

        scoreBar.innerHTML += `

            <div class="marker"
                 style="
                    left:${actualPos}%;
                    background:green;
                 ">
            </div>

        `;

        scoreLegend.innerHTML +=
          `🟢 Resultat (${actualResult})<br>`;
    }

}

setInterval(()=>{

  if(currentRound === 0){
     return;
  }

  const remaining =
    Math.max(
      0,
      Math.ceil(
        roundLength -
        (
          Date.now()
          - roundStartedAt
        ) / 1000
      )
    );

  if(remaining > 0){

      document
       .getElementById("timer")
       .innerText =
       remaining + " sek";

      document
       .getElementById("histogram")
       .style.display =
       "none";

       document
        .getElementById("scoreBarContainer")
        .style.display =
        "none";

  }
  else{

      document
       .getElementById("timer")
       .innerText =
       "⏰ Tiden er udløbet";

      document
       .getElementById("histogram")
       .style.display =
       "block";

       document
        .getElementById("scoreBarContainer")
        .style.display =
        "block";

        drawScoreBar();

      let html = `
      <h2>Deltagerens gæt: ${playerGuess}</h2>
      <h2>Laveste gæt: ${minGuess}</h2>
      <h2>Højeste gæt: ${maxGuess}</h2>
      `;

      if(showAverage){

        html += `
        <h2>
        Publikums gennemsnit:
        ${averageGuess.toFixed(1)}
        </h2>
        `;

      }

      if(showActual){

        const audienceDistance =
          Math.abs(
            averageGuess -
            actualResult
          );

        const playerDistance =
          Math.abs(
            playerGuess -
            actualResult
          );

        const winner =
          audienceDistance <
          playerDistance
          ? "👥 PUBLIKUM"
          : "🧍 DELTAGEREN";

        html += `
        <h2>
        Faktisk resultat:
        ${actualResult}
        </h2>

        <div id="winnerText">
        ${winner} VINDER
        </div>
        `;
        ``
      }

      document
       .getElementById("results")
       .innerHTML =
       html;
  }

},250);

</script>

</body>
</html>
