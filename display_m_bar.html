<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Storskærm</title>

<style>

body{
    font-family: Arial, sans-serif;
    text-align:center;
    padding:40px;
    
    min-height:100vh;

    background:
      linear-gradient(
        180deg,
        #f2f8ff,
        #d9ecff
      );
}

#card{
    background:white;

    max-width:1200px;

    margin:40px auto;

    padding:40px;

    border-radius:20px;

    box-shadow:
      0 10px 30px rgba(0,0,0,0.15);
}

#welcomeScreen{
    margin-top:150px;
}

#title{
    font-size:140px;
    font-weight:900;
    color:#005a9c;
    margin-bottom:20px;
}

#welcomeScreen h2{
    font-size:50px;
    color:#666;
}


#question{
    font-size:120px;
    font-weight:900;
    color:#005a9c;
    text-transform:uppercase;
    letter-spacing:8px;
    margin-top:80px;
    margin-bottom:40px;
}

#count{
    font-size:60px; 
    color:#005a9c;
}

.bar{
    background:#0078d4;
    height:24px;
    margin:6px;
    border-radius:12px;
}

.row{
    display:flex;
    align-items:center;
    gap:10px;
}

.label{
    width:120px;
    text-align:right;
}

#timer{
    font-size:72px;
    color:#005a9c;
    font-weight:bold;
    margin:20px 0;
}

#countHeader{
    color:#003366;
}

#scoreBar{

    position:relative;

    width:900px;

    height:8px;

    background:#bbbbbb;

    margin:40px auto;

    border-radius:6px;
}

.marker{

    position:absolute;

    top:-18px;

    width:20px;

    height:20px;

    border-radius:50%;
}

</style>
</head>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
 getFirestore,
 collection,
 onSnapshot,
 doc
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {

 apiKey: "GFD3K4mE3uLxfVnTOKfz9KU8HuPMVrY",

 authDomain:
 "alle-mod-en.firebaseapp.com",

 projectId:
 "alle-mod-en",

 storageBucket:
 "alle-mod-en.firebasestorage.app",

 messagingSenderId:
 "982698004873",

 appId:
 "1:982698004873:web:6d0494926004041fae1158"
};

const app =
 initializeApp(firebaseConfig);

const db =
 getFirestore(app);

let currentRound = 1;
let roundStartedAt = 0;
let roundLength = 30;
let minGuess = 0;
let maxGuess = 0;
let playerGuess = 0;
let averageGuess = 0;
let showAverage = false;
let actualResult = 0;
let showActual = false;
let previousRound = 0;
let rangeMin = 0;
let rangeMax = 200;


onSnapshot(
 doc(db,"Games","current"),
(snapshot)=>{

 const data =
   snapshot.data();

 rangeMin =
  data.rangeMin ?? 0;

 rangeMax =
  data.rangeMax ?? 200;

 
 playerGuess =
  data.playerGuess ?? 0;

 showAverage =
  data.showAverage ?? false;

 actualResult =
  data.actualResult ?? 0;

 showActual =
  data.showActual ?? false;

currentRound =
   data.round;

   if(currentRound !== previousRound){

  document
    .getElementById("count")
    .innerText = "0";

  document
    .getElementById("histogram")
    .innerHTML = "";

  document
    .getElementById("histogram")
    .style.display = "none";

  previousRound = currentRound;
}

 roundStartedAt =
   data.roundStartedAt || 0;

 roundLength =
   data.roundLength || 30;

if(currentRound === 0){

  document
    .getElementById("question")
    .innerText =
    "Alle mod En";

}
else{

  document
    .getElementById("question")
    .innerText =
    data.title;

}

if(currentRound === 0){

  document
    .getElementById("timer")
    .style.display = "none";

  document
    .getElementById("count")
    .style.display = "none";

  document
    .getElementById("results")
    .style.display = "none";

  document
    .getElementById("histogram")
    .style.display = "none";

}
else{

  document
    .getElementById("timer")
    .style.display = "block";

  document
    .getElementById("count")
    .style.display = "block";

  document
    .getElementById("results")
    .style.display = "block";

}

if(currentRound > 0){

  document
    .getElementById("results")
    .innerHTML =
    `
    <h2>Deltagerens gæt</h2>
    <h1>${data.playerGuess}</h1>
    `;

}

});

onSnapshot(
 collection(db,"guesses"),
 (snapshot)=>{

   const values = [];

   snapshot.forEach(docItem=>{

     const data =
       docItem.data();

     if(data.round === currentRound){

       values.push(
         Number(data.value)
       );

     }

   });

   document
     .getElementById("count")
     .innerText =
     values.length;

   drawHistogram(values);

   if(values.length > 0){

      minGuess =
        Math.min(...values);

      maxGuess =
        Math.max(...values);

      averageGuess =
        values.reduce(
          (a,b)=>a+b,
          0
          ) / values.length;

    }

 });

function drawHistogram(values){

 const histogram =
 document.getElementById("histogram");

 histogram.innerHTML = "";

 if(values.length === 0) return;

 const bucketSize = 10;

 const buckets = {};

 values.forEach(v=>{

   const bucket =
   Math.floor(v/bucketSize)
   * bucketSize;

   buckets[bucket] =
   (buckets[bucket] || 0) + 1;

 });

 Object.keys(buckets)
 .sort((a,b)=>a-b)
 .forEach(bucket=>{

   const count =
   buckets[bucket];

   histogram.innerHTML += `

     <div class="row">

       <div class="label">

       ${bucket}-${Number(bucket)+9}

       </div>

       <div
         class="bar"
         style="
           width:${count*15}px;
         ">
       </div>

       <div>${count}</div>

     </div>

   `;

 });

}

setInterval(()=>{
  if(currentRound === 0){

  document
    .getElementById("question")
    .style.display =
    "none";

  document
    .getElementById("timer")
    .style.display =
    "none";

  document
    .getElementById("count")
    .style.display =
    "none";

  document
    .getElementById("results")
    .style.display =
    "none";

  document
    .getElementById("histogram")
    .style.display =
    "none";

  document
  .getElementById("countHeader")
  .style.display = "none";

  return;
}

else{
document
  .getElementById("timer")
  .style.display =
  "block";

document
  .getElementById("count")
  .style.display =
  "block";

document
  .getElementById("results")
  .style.display =
  "block";

document
  .getElementById("countHeader")
  .style.display = "block";
}

  if(!roundStartedAt){
    return;
  }

  const elapsed =
    (Date.now() - roundStartedAt) / 1000;

  const remaining =
    Math.max(
      0,
      Math.ceil(
        roundLength - elapsed
      )
    );

  if(remaining <= 0){

  document
    .getElementById("timer")
    .innerText =
    "⏰ Tiden er udløbet";

  document
    .getElementById("histogram")
    .style.display =
    "block";
    
  document
    .getElementById("results")
    .innerHTML = `

      <h2>
      Deltagerens gæt:
      ${playerGuess}
      </h2>

      <h2>
      Laveste gæt:
      ${minGuess}
      </h2>

      <h2>
      Højeste gæt:
      ${minGuess}
      </h2>

    `;
      if(showAverage){
      
      const scoreBar =
      document.getElementById("scoreBar");

      const size =
      rangeMax - rangeMin;

      const minPos =
      ((minGuess-rangeMin)/size)*100;

      const playerPos =
      ((playerGuess-rangeMin)/size)*100;

      const avgPos =
      ((averageGuess-rangeMin)/size)*100;

      scoreBar.innerHTML = `

      <div class="marker"
        style="left:${minPos}%;
        background:red;">
      </div>


      <div
          style="
          position:absolute;
          left:${minPos}%;
          top:-50px;
          transform:translateX(-50%);
          color:red;
          font-weight:bold;
          ">
          minGuess
      </div>

      <div class="marker"
        style="left:${playerPos}%;
        background:orange;">
      </div>

      <div
          style="
          position:absolute;
          left:${playerPos}%;
          top:-50px;
          transform:translateX(-50%);
          color:orange;
          font-weight:bold;
          ">
          minGuess
      </div>

      <div class="marker"
        style="left:${avgPos}%;
      background:blue;">
      </div>

      <div
          style="
          position:absolute;
          left:${avgPos}%;
          top:-50px;
          transform:translateX(-50%);
          color:blue;
          font-weight:bold;
          ">
          avgPos
      </div>

      `;

      document
        .getElementById("results")
        .innerHTML += `

      <h2>
      Publikums gennemsnit:
      ${averageGuess.toFixed(1)}
      </h2>

      `;

  }

  }
  else{

    document
      .getElementById("timer")
      .innerText =
      remaining + " sek";

    document
      .getElementById("histogram")
      .style.display =
      "none";

  }

  const scoreBar =
    document.getElementById("scoreBar");

  const size =
    rangeMax - rangeMin;

  const minPos =
    ((minGuess-rangeMin)/size)*100;

  const playerPos =
    ((playerGuess-rangeMin)/size)*100;

  const avgPos =
    ((averageGuess-rangeMin)/size)*100;

  scoreBar.innerHTML = `

  <div class="marker"
    style="left:${minPos}%;
    background:red;">
  </div>

  <div class="marker"
    style="left:${playerPos}%;
    background:orange;">
  </div>

  <div class="marker"
    style="left:${avgPos}%;
    background:blue;">
  </div>

  `;

  if(showActual){

      const actualPos =
        ((actualResult - rangeMin) /
        (rangeMax - rangeMin))
        * 100;

      const scoreBar =
        document.getElementById("scoreBar");

      scoreBar.innerHTML += `

        <div
          class="marker"
          style="
          left:${actualPos}%;
          background:green;
          ">
        </div>

        <div
          style="
          position:absolute;
          left:${actualPos}%;
          top:-50px;
          transform:translateX(-50%);
          color:green;
          font-weight:bold;
          ">
          Resultat
        </div>
      `;


      const audienceDistance =
        Math.abs(
        averageGuess -
        actualResult
        );

      const playerDistance =
        Math.abs(
        playerGuess -
        actualResult
        );

      const winner =
        audienceDistance <
        playerDistance
        ? "👥 PUBLIKUM"
        : "🧍 DELTAGEREN";

      document
        .getElementById("results")
        .innerHTML += `

      <h2>
      Faktisk resultat:
      ${actualResult}
      </h2>

      <h1>
      ${winner} VINDER
      </h1>

      `;
  }


}, 250);




</script>

<body>

<div id="welcomeScreen">

  <h1 id="title">
    ALLE MOD EN
  </h1>

  <h2>
    Spildevand Plan & Projekt
  </h2>

</div>

<div id="card">

<h1 id="question">ALLE MOD EN</h1>
<h1 id="timer">30 sek</h1>

<h2 id="countHeader">Svar modtaget</h2>

<div id="count">0</div>

<hr>

<div id="results"></div>

<div id="scoreBar"></div>

<div id="histogram" style="display:none;"></div>

</div>

<body>
<html>
