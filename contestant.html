<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Alle mod En</title>
</head>

<style>

#rangeText{

    font-size:24px;

    color:#666;

    margin-bottom:20px;

}

#welcomeScreen{

    display:none;

    margin-top:150px;

    text-align:center;
}

#welcomeScreen h1{

    font-size:80px;

    color:#005a9c;
}

#welcomeScreen h2{

    color:#666;
}

</style>

<body>

<div id="welcomeScreen">

  <h1>ALLE MOD EN</h1>

  <h2>Konkurrencen starter om lidt</h2>

</div>

<h1 id="question">Indlæser spørgsmål...</h1>

<p id="rangeText"></p>

<p id="openStatus">
Afstemning åben
</p>

<input id="guess" type="number">

<button id="sendBtn">
Send svar
</button>

<p id="status"></p>

<h2 id="timer">
      30
</h2>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
 getFirestore,
 collection,
 addDoc,
 doc,
 onSnapshot,
 query,
 getDoc,
 updateDoc
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {

 apiKey: "GFD3K4mE3uLxfVnTOKfz9KU8HuPMVrY",

 authDomain:
 "alle-mod-en.firebaseapp.com",

 projectId:
 "alle-mod-en",

 storageBucket:
 "alle-mod-en.firebasestorage.app",

 messagingSenderId:
 "982698004873",

 appId:
 "1:982698004873:web:6d0494926004041fae1158"

};

const app =
 initializeApp(firebaseConfig);

const db =
  getFirestore(app);
  let currentRound = 1;
  let acceptAnswers = true;
  let roundStartedAt = 0;
  let roundLength = 60;
  let rangeMin = 0;
  let rangeMax = 20;

onSnapshot(
  doc(db,"Games","current"),
  
  (snapshot) => {

    const data = snapshot.data();

    rangeMin =
      data.rangeMin ?? 0;

    rangeMax =
      data.rangeMax ?? 0;

    roundStartedAt =
    data.roundStartedAt || 0;

    roundLength =
    data.roundLength || 30;

    currentRound = data.round;

    if(currentRound === 0){

      document
        .getElementById("welcomeScreen")
        .style.display =
        "block";

      document
        .getElementById("question")
        .style.display =
        "none";

      document
        .getElementById("rangeText")
        .style.display =
        "none";

      document
        .getElementById("openStatus")
        .style.display =
        "none";

      document
        .getElementById("guess")
        .style.display =
        "none";

      document
        .getElementById("sendBtn")
        .style.display =
        "none";

      document
        .getElementById("timer")
        .style.display =
        "none";

      return;
    }

    document
      .getElementById("welcomeScreen")
      .style.display =
      "none";

    document
      .getElementById("question")
      .style.display =
      "block";

    document
      .getElementById("rangeText")
      .style.display =
      "block";

    document
      .getElementById("openStatus")
      .style.display =
      "block";

    document
      .getElementById("guess")
      .style.display =
      "inline";

    document
      .getElementById("sendBtn")
      .style.display =
      "inline";

    document
      .getElementById("timer")
      .style.display =
      "block";

      document
        .getElementById("openStatus")
        .innerText =
        "✅ Afstemning åben";

      document
        .getElementById("guess")
        .style.display = "inline";

      document
        .getElementById("sendBtn")
        .style.display = "inline";

      document
        .getElementById("guess")
        .value = "";

      document
        .getElementById("status")
        .innerHTML = "";

      document
        .getElementById("guess")
        .disabled = false;

      document
        .getElementById("sendBtn")
        .disabled = false;


    document
      .getElementById("question")
      .innerText =
      data.title;

    document
      .getElementById("rangeText")
      .innerText =
      `Gæt mellem ${rangeMin} og ${rangeMax}`;

    acceptAnswers =
      data.acceptAnswers;
      
  }
);

document
 .getElementById("sendBtn")
 .addEventListener(
 "click",
 async ()=>{
 

    const value =
      Number(
        document
        .getElementById("guess")
        .value
      );

if(
      value < rangeMin
      ||
      value > rangeMax
    ){

      document
        .getElementById("status")
        .innerHTML =
        `Indtast et tal mellem ${rangeMin} og ${rangeMax}`;

      return;
    }

  if (!acceptAnswers) {

  document
    .getElementById("status")
    .innerHTML =
    "⛔ Afstemningen er lukket";

  return;
}

 const gameSnapshot =
  await getDoc(
    doc(db,"Games","current")
  );


await updateDoc(
  doc(db,"Games","current"),
  {
    playerGuess: value
  }
);



    document
     .getElementById("status")
     .innerHTML =
      "<h2>Dit svar er registreret!</h2>";

     document
    .getElementById("guess")
    .style.display = "none";

    document
    .getElementById("sendBtn")
    .style.display = "none";
 });

setInterval(()=>{

  if(!roundStartedAt){
    return;
  }

  const elapsed =
    (Date.now() - roundStartedAt)
    / 1000;

  const remaining =
    Math.max(
      0,
      Math.ceil(
        roundLength - elapsed
      )
    );

  document
    .getElementById("timer")
    .innerText =
    remaining + " sek";
  
    if(remaining <= 0){

      document
        .getElementById("sendBtn")
        .disabled = true;

      document
        .getElementById("guess")
        .disabled = true;

      document
        .getElementById("openStatus")
        .innerText =
        "⛔ Afstemning lukket";
  

    }
} ,250);

</script>

</body>
</html>
