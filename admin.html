 document

document

 async ()=>{

     .value;

   const rangeMin =
     Number(
       document
       .getElementById("rangeMin3")
       .value
     );

   const rangeMax =
     Number(

       .value
     );

   await updateDoc(
     doc(db,"Games","current"),
     {

       roundStartedAt:Date.now(),
       roundLength:60,
       rangeMin:rangeMin,
       rangeMax:rangeMax,
       playerGuess:0,
       showAverage:false,
       showActual:false,
       actualResult:0
     }
   );

 });


 document
 .getElementById("showAverageBtn")
 .addEventListener(
 "click",
 async ()=>{

  const actual =
   Number(
    document.getElementById("actualValue").value
   );

  await updateDoc(
    doc(db,"Games","current"),
    {
      showAverage: true
    }
  );

  const gameSnapshot =
   await getDoc(
    doc(db,"Games","current")
   );

  const currentRound =
   gameSnapshot.data().round;

  const snapshot =
   await getDocs(
    collection(db,"guesses")
   );

  let answers = [];

  snapshot.forEach(docItem => {

   const data =
    docItem.data();

   if(data.round === currentRound){
      answers.push(data.value);
   }

  });

  const average =
   answers.reduce((a,b)=>a+b,0)
   / answers.length;

  const audienceDistance =
   Math.abs(average - actual);

  const playerDistance =
   Math.abs(playerGuess - actual);

  const winner =
   audienceDistance < playerDistance
   ? "👥 PUBLIKUM"
   : "🧍 DELTAGEREN";

  document
   .getElementById("resultBox")
   .innerHTML = `

   <h3>${winner} VINDER</h3>

   <p>
   Antal svar:
   ${answers.length}
   </p>

   <p>
   Publikum:
   ${average.toFixed(1)}
   </p>

   <p>
   Deltager:
   ${playerGuess}
   </p>

   <p>
   Faktisk:
   ${actual}
   </p>

   <p>
   Publikums afvigelse:
   ${audienceDistance.toFixed(1)}
   </p>

   <p>
   Deltagerens afvigelse:
   ${playerDistance.toFixed(1)}
   </p>
   `;
 }
);

document
.getElementById("revealBtn")
.addEventListener(
 "click",
 async ()=>{

   const actual =
     Number(
       document
       .getElementById("actualValue")
       .value
     );

   await updateDoc(
     doc(db,"Games","current"),
     {
       actualResult: actual,
       showActual: true
     }
   );

 });

document
  .getElementById("resetGame")
  .addEventListener(
  "click",
  async ()=>{

    // Slet alle gæt

    const guessesSnapshot =
      await getDocs(
        collection(db,"guesses")
      );

    for(const guessDoc of guessesSnapshot.docs){

      await deleteDoc(
        doc(
          db,
          "guesses",
          guessDoc.id
        )
      );

    }

    // Nulstil spillet

    await updateDoc(
      doc(db,"Games","current"),
      {
        round: 0,
        playerGuess: 0,
        actualResult: 0,
        showAverage: false,
        showActual: false,
        acceptAnswers: false,
        roundStartedAt: 0
      }
    );

    document
      .getElementById("status")
      .innerHTML =
      "✅ Spillet er nulstillet";

  });

</script>
