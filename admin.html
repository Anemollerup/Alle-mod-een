     Start runde 3

      Beregn publikum
    </button>

    <input
      id="actualValue1"
      type="number"
      placeholder="Faktisk resultat">


    <button id="revealBtn1">
      Vis resultat
    </button>

      <br><br>

  <p>Spørgsmål</p>

  <input
    id="question3"
    style="width:500px;">

  <label>Min:</label>

  <input
    id="rangeMin3"
    type="number"
    value="0">

  <label>Max:</label>

  <input
    id="rangeMax3"
    type="number"
    value="20">





</div>


<br><br>

<hr>

<p>
Aktuel runde:
<span id="roundNumber"></span>
</p>

<button id="resetGame">
Nulstil spil
</button>

<p id="status"></p>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
 getFirestore,
 collection,
 addDoc,
 doc,
 getDoc,
 getDocs,
 updateDoc,
 deleteDoc,
 onSnapshot,
 query,
 increment
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {

 apiKey: "GFD3K4mE3uLxfVnTOKfz9KU8HuPMVrY",

 authDomain:
 "alle-mod-en.firebaseapp.com",

 projectId:
 "alle-mod-en",

 storageBucket:
 "alle-mod-en.firebasestorage.app",

 messagingSenderId:
 "982698004873",

 appId:
 "1:982698004873:web:6d0494926004041fae1158"

};

const app =
 initializeApp(firebaseConfig);

const db =
 getFirestore(app);
 let currentRound = 1;

async function loadCurrentData() {

 const snap =
   await getDoc(
     doc(db,"Games","current")
   );
console.log(snap.data());

 document
   .getElementById("questionInput")
   .value =
   snap.data().title;

 document
   .getElementById("roundNumber")
   .innerText =
   snap.data().round;
}


loadCurrentData();

document
.getElementById("startRound1")
.addEventListener(
 "click",
 async ()=>{

    document
    .getElementById("resultBox")
    .innerHTML = "";

   const title =
     document
     .getElementById("question1")
     .value;

   const rangeMin =
     Number(
       document
       .getElementById("rangeMin1")
       .value
     );

   const rangeMax =
     Number(
       document
       .getElementById("rangeMax1")
       .value
     );

   await updateDoc(
     doc(db,"Games","current"),
     {
       title:title,
       round:1,
       acceptAnswers:true,
       roundStartedAt:Date.now(),
       roundLength:60,
       rangeMin:rangeMin,
       rangeMax:rangeMax,
       playerGuess:0,
       showAverage:false,
       showActual:false,
       actualResult:0
     }
   );
document
    .getElementById("status")
    .innerHTML =
    "✅ Runde 1 startet";

 });

 document
.getElementById("startRound2")
.addEventListener(
 "click",
 async ()=>{

  document
  .getElementById("resultBox")
  .innerHTML = "";

   const title =
     document
     .getElementById("question2")
     .value;

   const rangeMin =
     Number(
       document
       .getElementById("rangeMin2")
       .value
     );

   const rangeMax =
     Number(
       document
       .getElementById("rangeMax2")
       .value
     );

   await updateDoc(
     doc(db,"Games","current"),
     {
       title:title,
       round:2,
       acceptAnswers:true,
       roundStartedAt:Date.now(),
       roundLength:60,
       rangeMin:rangeMin,
       rangeMax:rangeMax,
       playerGuess:0,
       showAverage:false,
       showActual:false,
       actualResult:0
     }
   );
document
    .getElementById("status")
    .innerHTML =
    "✅ Runde 2 startet";
 });

document
.getElementById("startRound3")
.addEventListener(
 "click",
 async ()=>{

  document
  .getElementById("resultBox")
  .innerHTML = "";

   const title =
     document
     .getElementById("question3")
     .value;

   const rangeMin =
     Number(
       document
       .getElementById("rangeMin3")
       .value
     );

   const rangeMax =
     Number(
       document
       .getElementById("rangeMax3")
       .value
     );

   await updateDoc(
     doc(db,"Games","current"),
     {
       title:title,
       round:3,
       acceptAnswers:true,
       roundStartedAt:Date.now(),
       roundLength:60,
       rangeMin:rangeMin,
       rangeMax:rangeMax,
       playerGuess:0,
       showAverage:false,
       showActual:false,
       actualResult:0
     }
   );
document
    .getElementById("status")
    .innerHTML =
    "✅ Runde 3 startet";
 });


 document
 .getElementById("showAverageBtn1")
 .addEventListener(
 "click",
 async ()=>{


  await updateDoc(
    doc(db,"Games","current"),
    {
      showAverage: true
    }
  );

  document
  .getElementById("status")
  .innerHTML =
  "✅ Publikumsgennemsnit vist";

});

document
 .getElementById("showAverageBtn2")
 .addEventListener(
 "click",
 async ()=>{


  await updateDoc(
    doc(db,"Games","current"),
    {
      showAverage: true
    }
  );

  document
  .getElementById("status")
  .innerHTML =
  "✅ Publikumsgennemsnit vist";
  });

document
 .getElementById("showAverageBtn3")
 .addEventListener(
 "click",
 async ()=>{


  await updateDoc(
    doc(db,"Games","current"),
    {
      showAverage: true
    }
  );

  document
  .getElementById("status")
  .innerHTML =
  "✅ Publikumsgennemsnit vist";

});


const snapshot =
   await getDocs(
    collection(db,"guesses")
   );

let answers = [];

snapshot.forEach(docItem => {

   const data =
    docItem.data();

   if(data.round === currentRound){
      answers.push(data.value);
   }
  
});

const average =
   answers.reduce((a,b)=>a+b,0)
   / answers.length;

document
.getElementById("revealBtn1")
.addEventListener(
 "click",
 async ()=>{

   const actual =
     Number(
       document
       .getElementById("actualValue1")
       .value
     );

   await updateDoc(
     doc(db,"Games","current"),
     {
       actualResult: actual,
       showActual:true
     }
   );

   document
     .getElementById("status")
     .innerHTML =
     "✅ Resultat vist";

 });

document
.getElementById("revealBtn2")
.addEventListener(
 "click",
 async ()=>{

   const actual =
     Number(
       document
       .getElementById("actualValue2")
       .value
     );

   await updateDoc(
     doc(db,"Games","current"),
     {
       actualResult: actual,
       showActual:true
     }
   );

   document
     .getElementById("status")
     .innerHTML =
     "✅ Resultat vist";

 });

 document
.getElementById("revealBtn3")
.addEventListener(
 "click",
 async ()=>{

   const actual =
     Number(
       document
       .getElementById("actualValue3")
       .value
     );

   await updateDoc(
     doc(db,"Games","current"),
     {
       actualResult: actual,
       showActual:true
     }
   );

   document
     .getElementById("status")
     .innerHTML =
     "✅ Resultat vist";

 });

onSnapshot(
 doc(db,"Games","current"),
 snapshot => {

   const data =
     snapshot.data();

   document
     .getElementById("roundNumber")
     .innerText =
     data.round;

 });


document
  .getElementById("resetGame")
  .addEventListener(
  "click",
  async ()=>{

    // Slet alle gæt

    const guessesSnapshot =
      await getDocs(
        collection(db,"guesses")
      );

    for(const guessDoc of guessesSnapshot.docs){

      await deleteDoc(
        doc(
          db,
          "guesses",
          guessDoc.id
        )
      );

    }

    // Nulstil spillet

    await updateDoc(
      doc(db,"Games","current"),
      {
        round: 0,
        title:"",
        playerGuess: 0,
        actualResult: 0,
        showAverage: false,
        showActual: false,
        acceptAnswers: false,
        roundStartedAt: 0
      }
    );

    document
      .getElementById("status")
      .innerHTML =
      "✅ Spillet er nulstillet";

  });

</script>
