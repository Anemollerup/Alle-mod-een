<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Admin</title>
</head>

<body>

<h1>Admin Panel</h1>

<p>Spørgsmål</p>

<input
 id="questionInput"
 style="width:600px;"
>

<button id="startRound">
Start ny runde
</button>

<input id="rangeMin" type="number" value="0">

<input id="rangeMax" type="number" value="20">

<br><br>


<hr>

<h2>Resultat</h2>

<input
 id="actualValue"
 type="number"
 placeholder="Faktisk resultat">

<br><br>

<button id="showAverageBtn">
Beregn publikum
</button>

<button id="revealBtn">
Afslør resultat
</button>

<div id="resultBox"></div>

<p>
Aktuel runde:
<span id="roundNumber"></span>
</p>

<p id="status"></p>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
 getFirestore,
 collection,
 addDoc,
 doc,
 getDoc,
 getDocs,
 updateDoc,
 onSnapshot,
 query,
 increment
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {

 apiKey: "GFD3K4mE3uLxfVnTOKfz9KU8HuPMVrY",

 authDomain:
 "alle-mod-en.firebaseapp.com",

 projectId:
 "alle-mod-en",

 storageBucket:
 "alle-mod-en.firebasestorage.app",

 messagingSenderId:
 "982698004873",

 appId:
 "1:982698004873:web:6d0494926004041fae1158"

};

const app =
 initializeApp(firebaseConfig);

const db =
 getFirestore(app);
 let currentRound = 1;

async function loadCurrentData() {

 const snap =
   await getDoc(
     doc(db,"Games","current")
   );
console.log(snap.data());

 document
   .getElementById("questionInput")
   .value =
   snap.data().title;

 document
   .getElementById("roundNumber")
   .innerText =
   snap.data().round;
}


loadCurrentData();

document
.getElementById("startRound")
.addEventListener(
 "click",
 async ()=>{

  const title =
    document
    .getElementById("questionInput")
    .value;

  const rangeMin =
    Number(
      document.getElementById("rangeMin").value
    );

  const rangeMax =
    Number(
      document.getElementById("rangeMax").value
    );


await updateDoc(
  doc(db,"Games","current"),
  {
      title:title,
      acceptAnswers:true,
      round: increment(1),
      roundStartedAt: Date.now(),
      roundLength: 60,

      rangeMin: rangeMin,
      rangeMax: rangeMax,

      playerGuess:0,
      actualResult:0,
      showAverage:false,
      showActual:false
  }
);

  const snap =
    await getDoc(
      doc(db,"Games","current")
    );

  document
    .getElementById("roundNumber")
    .innerText =
    snap.data().round;

  document
    .getElementById("status")
    .innerHTML =
    "✅ Ny runde startet";

 });

 document
 .getElementById("showAverageBtn")
 .addEventListener(
 "click",
 async ()=>{

  const actual =
   Number(
    document.getElementById("actualValue").value
   );

  await updateDoc(
    doc(db,"Games","current"),
    {
      showAverage: true
    }
  );

  const gameSnapshot =
   await getDoc(
    doc(db,"Games","current")
   );

  const currentRound =
   gameSnapshot.data().round;

  const snapshot =
   await getDocs(
    collection(db,"guesses")
   );

  let answers = [];

  snapshot.forEach(docItem => {

   const data =
    docItem.data();

   if(data.round === currentRound){
      answers.push(data.value);
   }

  });

  const average =
   answers.reduce((a,b)=>a+b,0)
   / answers.length;

  const audienceDistance =
   Math.abs(average - actual);

  const playerDistance =
   Math.abs(playerGuess - actual);

  const winner =
   audienceDistance < playerDistance
   ? "👥 PUBLIKUM"
   : "🧍 DELTAGEREN";

  document
   .getElementById("resultBox")
   .innerHTML = `

   <h3>${winner} VINDER</h3>

   <p>
   Antal svar:
   ${answers.length}
   </p>

   <p>
   Publikum:
   ${average.toFixed(1)}
   </p>

   <p>
   Deltager:
   ${playerGuess}
   </p>

   <p>
   Faktisk:
   ${actual}
   </p>

   <p>
   Publikums afvigelse:
   ${audienceDistance.toFixed(1)}
   </p>

   <p>
   Deltagerens afvigelse:
   ${playerDistance.toFixed(1)}
   </p>
   `;
 }
);

document
.getElementById("revealBtn")
.addEventListener(
 "click",
 async ()=>{

   const actual =
     Number(
       document
       .getElementById("actualValue")
       .value
     );

   await updateDoc(
     doc(db,"Games","current"),
     {
       actualResult: actual,
       showActual: true
     }
   );

 });

</script>

</body>
</html>
