console.log(snap.data());

document
.getElementById("revealBtn1")
.addEventListener(
 "click",
 async ()=>{

   const actual =
     Number(
       document
       .getElementById("actualValue1")
       .value
     );

   const snapshot =
      await getDocs(
        collection(db,"guesses")
      );

    let answers = [];

    snapshot.forEach(docItem => {

      const data =
        docItem.data();

      if(data.round === 1){

          answers.push(
            Number(data.value)
          );

      }

    });

    const average =
      answers.reduce(
        (a,b)=>a+b,
        0
      ) / answers.length;

    const gameSnapshot =
      await getDoc(
        doc(db,"Games","current")
      );

    const playerGuess =
      gameSnapshot.data().playerGuess;

    const audienceDistance =
      Math.abs(
        average - actual
      );

    const playerDistance =
      Math.abs(
        playerGuess - actual
      );

    const roundWinner =
      audienceDistance <
      playerDistance
      ? "audience"
      : "player";

   await updateDoc(
     doc(db,"Games","current"),
     {
       actualResult: actual,
       showActual:true,
       round1Winner: roundWinner
     }
   );

   document
     .getElementById("status")
     .innerHTML =
     "✅ Resultat vist";

 });

     .innerText =
     data.round;

   updateRoundDisplay(

document
  .getElementById("resetGame")
  .addEventListener(
  "click",
  async ()=>{

    // Slet alle gæt

    const guessesSnapshot =
      await getDocs(
        collection(db,"guesses")
      );

    for(const guessDoc of guessesSnapshot.docs){

      await deleteDoc(
        doc(
          db,
          "guesses",
          guessDoc.id
        )
      );

    }

    // Nulstil spillet

  await updateDoc(
    doc(db,"Games","current"),
    {
      round:0,
      title:"",
      playerGuess:0,
      actualResult:0,
      showAverage:false,
      showActual:false,
      acceptAnswers:false,
      roundStartedAt:0,

      round1Winner:"",
      round2Winner:"",
      round3Winner:"",

      playerName:"",
      showFinal:false
    }
  );

    document
      .getElementById("status")
      .innerHTML =
      "✅ Spillet er nulstillet";

  //aktiver alle bokse, så der kan skrives input
  [
    1,2,3
  ].forEach(n => {

      document
        .getElementById(
          "startRound" + n
        )
        .disabled = false;

      document
        .getElementById(
          "showAverageBtn" + n
        )
        .disabled = false;

      document
        .getElementById(
          "revealBtn" + n
        )
        .disabled = false;

});

  });

  [
 "question1","rangeMin1","rangeMax1",
 "question2","rangeMin2","rangeMax2",
 "question3","rangeMin3","rangeMax3"
].forEach(id => {

   const element =
     document.getElementById(id);

   element.value =
     localStorage.getItem(id)
     || element.value;

   element.addEventListener(
     "input",
     ()=>{
       localStorage.setItem(
         id,
         element.value
       );
     }
   );

});

function updateRoundDisplay(round){

    [1,2,3].forEach(n => {

        document
          .getElementById(
            "roundCard" + n
          )
          .classList.remove(
            "activeRound"
          );

        document
          .getElementById(
            "roundCard" + n
          )
          .classList.remove(
            "completedRound"
          );

    });

    if(round >= 1 && round <= 3){

        document
          .getElementById(
            "roundCard" + round
          )
          .classList.add(
            "activeRound"
          );
    }

    for(let i = 1; i < round; i++){

        document
          .getElementById(
            "roundCard" + i
          )
          .classList.add(
            "completedRound"
          );
    }

    for(let i = 1; i < round; i++){

        document
          .getElementById(
            "startRound" + i
          )
          .disabled = true;

        document
          .getElementById(
            "showAverageBtn" + i
          )
          .disabled = true;

        document
          .getElementById(
            "revealBtn" + i
          )
          .disabled = true;
      }

}
