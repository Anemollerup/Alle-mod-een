<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Alle mod En</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    padding:40px;
    background:#f6f8fb;
}

#question{
    font-size:40px;
    color:#005a9c;
}

#timer{
    font-size:60px;
    color:#005a9c;
    font-weight:bold;
}

input{
    font-size:24px;
    padding:10px;
    width:180px;
}

button{
    font-size:24px;
    padding:10px 20px;
    margin-left:10px;
}

#openStatus{
    font-size:24px;
    font-weight:bold;
}
</style>
</head>

<body>

<h1 id="question">Indlæser spørgsmål...</h1>

<p id="openStatus">
✅ Afstemning åben
</p>

<h2 id="timer">30 sek</h2>

<input id="guess" type="number">

<button id="sendBtn">
Send svar
</button>

<p id="status"></p>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
 getFirestore,
 collection,
 addDoc,
 doc,
 onSnapshot,
 getDoc
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {

 apiKey: "GFD3K4mE3uLxfVnTOKfz9KU8HuPMVrY",

 authDomain:
 "alle-mod-en.firebaseapp.com",

 projectId:
 "alle-mod-en",

 storageBucket:
 "alle-mod-en.firebasestorage.app",

 messagingSenderId:
 "982698004873",

 appId:
 "1:982698004873:web:6d0494926004041fae1158"

};

const app =
 initializeApp(firebaseConfig);

const db =
 getFirestore(app);

let currentRound = 0;
let previousRound = -1;

let roundStartedAt = 0;
let roundLength = 30;

let acceptAnswers = true;

onSnapshot(
 doc(db,"Games","current"),
 (snapshot)=>{

   const data =
     snapshot.data();

   currentRound =
     data.round;

   roundStartedAt =
     data.roundStartedAt || 0;

   roundLength =
     data.roundLength || 30;

   acceptAnswers =
     data.acceptAnswers;

   document
     .getElementById("question")
     .innerText =
     data.title;

   if(currentRound !== previousRound){

      localStorage.removeItem(
        "answeredRound"
      );

      document
        .getElementById("guess")
        .value = "";

      document
        .getElementById("status")
        .innerHTML = "";

      document
        .getElementById("guess")
        .style.display =
        "inline";

      document
        .getElementById("sendBtn")
        .style.display =
        "inline";

      document
        .getElementById("guess")
        .disabled = false;

      document
        .getElementById("sendBtn")
        .disabled = false;

      previousRound =
        currentRound;
   }

 });

document
 .getElementById("sendBtn")
 .addEventListener(
 "click",
 async ()=>{

   const answeredRound =
     localStorage.getItem(
       "answeredRound"
     );

   if(answeredRound == currentRound){

     document
       .getElementById("status")
       .innerHTML =
       "✅ Du har allerede svaret i denne runde";

     return;
   }

   const value =
     Number(
       document
       .getElementById("guess")
       .value
     );

   if(!value && value !== 0){

      return;
   }

   const elapsed =
     (Date.now() - roundStartedAt)
     / 1000;

   if(elapsed >= roundLength){

      document
        .getElementById("status")
        .innerHTML =
        "⛔ Tiden er udløbet";

      return;
   }

   const gameSnapshot =
     await getDoc(
       doc(db,"Games","current")
     );

   const roundNumber =
     gameSnapshot.data().round;

   await addDoc(
     collection(db,"guesses"),
     {
       value:value,
       round:roundNumber,
       timestamp:Date.now()
     }
   );

   localStorage.setItem(
     "answeredRound",
     currentRound
   );

   document
     .getElementById("status")
     .innerHTML =
     "<h2>🎉 Tak for dit svar!</h2>";

   document
     .getElementById("guess")
     .style.display =
     "none";

   document
     .getElementById("sendBtn")
     .style.display =
     "none";

 });

setInterval(()=>{

   if(!roundStartedAt){

      return;
   }

   const elapsed =
     (Date.now() - roundStartedAt)
     / 1000;

   const remaining =
     Math.max(
       0,
       Math.ceil(
         roundLength - elapsed
       )
     );

   document
     .getElementById("timer")
     .innerText =
     remaining + " sek";

   if(remaining > 0){

     document
       .getElementById("openStatus")
       .innerText =
       "✅ Afstemning åben";

   }
   else{

     document
       .getElementById("openStatus")
       .innerText =
       "⛔ Afstemning lukket";

     document
       .getElementById("guess")
       .disabled = true;

     document
       .getElementById("sendBtn")
       .disabled = true;

   }

},250);

</script>

</body>
</html>
``
