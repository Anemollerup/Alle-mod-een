<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Alle mod En</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    padding:40px;
    background:#f6f8fb;
}

#question{
    font-size:40px;
    color:#005a9c;
}

#timer{
    font-size:60px;
    color:#005a9c;
    font-weight:bold;
}

input{
    font-size:24px;
    padding:10px;
    width:180px;
}

button{
    font-size:24px;
    padding:10px 20px;
    margin-left:10px;
}

#openStatus{
    font-size:24px;
    font-weight:bold;
}

#rangeText{

    font-size:24px;

    color:#666;

    margin-bottom:20px;

}

#welcomeScreen{

    display:none;

    margin-top:150px;
}

#welcomeScreen h1{

    font-size:80px;

    color:#005a9c;
}

#welcomeScreen h2{

    color:#666;
}

</style>
</head>

<body>

<div id="welcomeScreen">

  <h1>ALLE MOD EN</h1>

  <h2>Konkurrencen starter om lidt</h2>

</div> 

<h1 id="question">Indlæser spørgsmål...</h1>

<p id="openStatus">
✅ Afstemning åben
</p>

<h2 id="timer">30 sek</h2>

<input id="guess" type="number">

<button id="sendBtn">
Send svar
</button>

<p id="rangeText"></p>

<p id="status"></p>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
 getFirestore,
 collection,
 addDoc,
 doc,
 onSnapshot,
 getDoc
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {

 apiKey: "GFD3K4mE3uLxfVnTOKfz9KU8HuPMVrY",

 authDomain:
 "alle-mod-en.firebaseapp.com",

 projectId:
 "alle-mod-en",

 storageBucket:
 "alle-mod-en.firebasestorage.app",

 messagingSenderId:
 "982698004873",

 appId:
 "1:982698004873:web:6d0494926004041fae1158"

};

const app =
 initializeApp(firebaseConfig);

const db =
 getFirestore(app);

let currentRound = 0;
let previousRound = -1;

let roundStartedAt = 0;
let roundLength = 30;

let acceptAnswers = true;
let rangeMin = 0;
let rangeMax = 20;

onSnapshot(
 doc(db,"Games","current"),
 (snapshot)=>{

   const data =
     snapshot.data();

   rangeMin =
    data.rangeMin ?? 0;

   rangeMax =
    data.rangeMax ?? 0;

   currentRound =
     data.round;

  if(currentRound === 0){

    document
      .getElementById("welcomeScreen")
      .style.display =
      "block";

    document
      .getElementById("question")
      .style.display =
      "none";

    document
      .getElementById("openStatus")
      .style.display =
      "none";

    document
      .getElementById("timer")
      .style.display =
      "none";

    document
      .getElementById("guess")
      .style.display =
      "none";

    document
      .getElementById("sendBtn")
      .style.display =
      "none";

    document
      .getElementById("rangeText")
      .style.display =
      "none";

    return;
  }

  document
  .getElementById("welcomeScreen")
  .style.display =
  "none";

  document
    .getElementById("question")
    .style.display =
    "block";

  document
    .getElementById("openStatus")
    .style.display =
    "block";

  document
    .getElementById("timer")
    .style.display =
    "block";

  document
    .getElementById("guess")
    .style.display =
    "inline";

  document
    .getElementById("sendBtn")
    .style.display =
    "inline";

  document
    .getElementById("rangeText")
    .style.display =
    "block";


   roundStartedAt =
     data.roundStartedAt || 0;

   roundLength =
     data.roundLength || 30;

   acceptAnswers =
     data.acceptAnswers;

   document
     .getElementById("question")
     .innerText =
     data.title;

   document
    .getElementById("rangeText")
    .innerText =
    `Gæt mellem ${rangeMin} og ${rangeMax}`;
  

   if(currentRound !== previousRound){

      localStorage.removeItem(
        "answeredRound"
      );

      document
        .getElementById("guess")
        .value = "";

      document
        .getElementById("status")
        .innerHTML = "";

      document
        .getElementById("guess")
        .style.display =
        "inline";

      document
        .getElementById("sendBtn")
        .style.display =
        "inline";

      document
        .getElementById("guess")
        .disabled = false;

      document
        .getElementById("sendBtn")
        .disabled = false;

      previousRound =
        currentRound;
   }

 });

document
 .getElementById("sendBtn")
 .addEventListener(
 "click",
 async ()=>{

   const answeredRound =
     localStorage.getItem(
       "answeredRound"
     );

   if(answeredRound == currentRound){

     document
       .getElementById("status")
       .innerHTML =
       "✅ Du har allerede svaret i denne runde";

     return;
   }

  console.log("Passerede check 1");


   const value =
     Number(
       document
       .getElementById("guess")
       .value
     );
  
   if(
      value < rangeMin
      ||
      value > rangeMax
    ){

      document
        .getElementById("status")
        .innerHTML =
        `Indtast et tal mellem ${rangeMin} og ${rangeMax}`;

      return;
    }

    console.log("Passerede check 1");

   if(!value && value !== 0){

      return;
   }
  console.log("Passerede check 1");

   const elapsed =
     (Date.now() - roundStartedAt)
     / 1000;

   if(elapsed >= roundLength){

      document
        .getElementById("status")
        .innerHTML =
        "⛔ Tiden er udløbet";

      return;
   }

console.log("Passerede check 1");

   const gameSnapshot =
     await getDoc(
       doc(db,"Games","current")
     );

   const roundNumber =
     gameSnapshot.data().round;



   console.log("Forsøger at gemme:", value);

try {
  
   await addDoc(
     collection(db,"guesses"),
     {
       value:value,
       round:roundNumber,
       timestamp:Date.now()
     }
   );

  console.log("Gemt!");

  }
catch(error){

  console.error(error);

}



   localStorage.setItem(
     "answeredRound",
     currentRound
   );

   document
     .getElementById("status")
     .innerHTML =
     "<h2>🎉 Tak for dit svar!</h2>";

   document
     .getElementById("guess")
     .style.display =
     "none";

   document
     .getElementById("sendBtn")
     .style.display =
     "none";

 });

setInterval(()=>{

   if(!roundStartedAt){

      return;
   }
console.log("Passerede check 1");

   const elapsed =
     (Date.now() - roundStartedAt)
     / 1000;

   const remaining =
     Math.max(
       0,
       Math.ceil(
         roundLength - elapsed
       )
     );

   document
     .getElementById("timer")
     .innerText =
     remaining + " sek";

   if(remaining > 0){

     document
       .getElementById("openStatus")
       .innerText =
       "✅ Afstemning åben";

   }
   else{

     document
       .getElementById("openStatus")
       .innerText =
       "⛔ Afstemning lukket";

     document
       .getElementById("guess")
       .disabled = true;

     document
       .getElementById("sendBtn")
       .disabled = true;

   }

},250);

</script>

</body>
</html>
``
